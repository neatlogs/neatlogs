name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install lint tools
        run: python -m pip install -r .github/requirements-lint.txt

      - name: Format (black)
        run: black --check neatlogs tests

      - name: Imports (isort)
        run: isort --check-only neatlogs tests

  test:
    runs-on: ubuntu-latest
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install -e .
          python -m pip install -r .github/requirements-test.txt

      - name: Unit tests
        # Keep third-party distribution entry points from changing collection.
        # pytest-asyncio is the one plugin the unit suite intentionally enables.
        run: python -m pytest -p pytest_asyncio.plugin -q

  compatibility:
    runs-on: ubuntu-latest
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      NEATLOGS_COMPAT_MODULE: ${{ matrix.module }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: logfire
            module: logfire
          - package: langfuse
            module: langfuse
          - package: lmnr
            module: lmnr
          - package: openlit
            module: openlit
          - package: traceloop-sdk
            module: traceloop.sdk
          - package: arize-phoenix-otel
            module: phoenix.otel
          - package: braintrust
            module: braintrust
          - package: ddtrace
            module: ddtrace
          - package: newrelic
            module: newrelic
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install NeatLogs and compatibility peer
        run: |
          python -m pip install -e .
          python -m pip install -r .github/requirements-test.txt
          python -m pip install "${{ matrix.package }}"

      - name: Import and private-provider coexistence
        run: python -m pytest -p pytest_asyncio.plugin -q tests/compatibility

  pydantic-ai-compatibility:
    runs-on: ubuntu-latest
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    strategy:
      fail-fast: false
      matrix:
        include:
          # otel-pin caps OpenTelemetry below 1.44 on the 0.7.5 lanes:
          # pydantic-ai 0.7.x imports opentelemetry._events, removed in 1.44.
          - python-version: "3.10"
            pydantic-ai-version: "0.7.5"
            adapter-version: "0.1.20"
            otel-pin: "opentelemetry-api==1.43.0 opentelemetry-sdk==1.43.0 opentelemetry-exporter-otlp-proto-http==1.43.0 opentelemetry-instrumentation==0.64b0 opentelemetry-instrumentation-threading==0.64b0 opentelemetry-instrumentation-logging==0.64b0"
          - python-version: "3.13"
            pydantic-ai-version: "0.7.5"
            adapter-version: "0.1.25"
            otel-pin: "opentelemetry-api==1.43.0 opentelemetry-sdk==1.43.0 opentelemetry-exporter-otlp-proto-http==1.43.0 opentelemetry-instrumentation==0.64b0 opentelemetry-instrumentation-threading==0.64b0 opentelemetry-instrumentation-logging==0.64b0"
          - python-version: "3.10"
            pydantic-ai-version: "1.44.0"
            adapter-version: "0.1.20"
            otel-pin: ""
          - python-version: "3.13"
            pydantic-ai-version: "1.44.0"
            adapter-version: "0.1.25"
            otel-pin: ""
          # Pydantic AI 2.41.0 imports enum.StrEnum, which is only available
          # on Python 3.11+. Keep the 3.10 lanes on earlier supported releases.
          - python-version: "3.11"
            pydantic-ai-version: "2.41.0"
            adapter-version: "0.1.20"
            otel-pin: ""
          - python-version: "3.13"
            pydantic-ai-version: "2.41.0"
            adapter-version: "0.1.25"
            otel-pin: ""
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Build and install NeatLogs with Pydantic AI
        run: |
          python -m pip install build uv
          uv lock --check
          python -m build --wheel
          wheel="$(find dist -name '*.whl' -print -quit)"
          python -m pip install "${wheel}[pydantic-ai]" -r .github/requirements-test-pydantic-ai.txt "pydantic-ai==${{ matrix.pydantic-ai-version }}" "openinference-instrumentation-pydantic-ai==${{ matrix.adapter-version }}" ${{ matrix.otel-pin }}
          python -m pip check

      - name: Pydantic AI semantic contract
        run: |
          cp tests/conftest.py "$RUNNER_TEMP/"
          cp tests/unit/test_pydantic_ai_native_instrumentation.py "$RUNNER_TEMP/"
          cd "$RUNNER_TEMP"
          python -m pytest -p pytest_asyncio.plugin -q test_pydantic_ai_native_instrumentation.py

  wheel-smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Build wheel and source distribution
        run: |
          python -m pip install build
          python -m build

      - name: Run quick starts from the installed wheel outside the checkout
        run: |
          python -m venv "${RUNNER_TEMP}/neatlogs-wheel"
          "${RUNNER_TEMP}/neatlogs-wheel/bin/python" -m pip install dist/*.whl
          cd "${RUNNER_TEMP}"
          "${RUNNER_TEMP}/neatlogs-wheel/bin/python" "${GITHUB_WORKSPACE}/tests/release/wheel_smoke.py"
