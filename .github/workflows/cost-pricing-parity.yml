name: Cost pricing parity (live)

on:
  schedule:
    # Weekly Monday 06:00 UTC. Catches upstream LiteLLM drift before it
    # silently desynchronizes the bundled catalog from the source of truth.
    - cron: "0 6 * * 1"
  workflow_dispatch:
    # Manual trigger for ad-hoc checks (e.g. after refreshing the fixture).
    inputs:
      ref:
        description: "Branch or tag to check out (defaults to repo default)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  parity:
    name: Live parity check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.event.repository.default_branch }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest

      - name: Run parity test against live LiteLLM
        env:
          NEATLOGS_RUN_PARITY: "1"
        run: |
          pytest tests/unit/test_cost_pricing_parity.py -v
