name: Package metadata

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: package-metadata-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  twine-check:
    name: sdist and wheel metadata
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Build sdist and wheel
        run: |
          python -m pip install build twine
          python -m build

      - name: Check the package metadata renders on PyPI
        run: python -m twine check --strict dist/*
