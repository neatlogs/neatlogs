name: Daily Python release

on:
  schedule:
    - cron: '11 8 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: weekly-python-release
  cancel-in-progress: false

# plan runs daily without secrets. Only when a release is due does release wait
# for approval in the `release` environment (main only, required reviewers),
# which holds RELEASE_APP_PRIVATE_KEY. publish then waits in the `pypi`
# environment, the only identity PyPI's trusted publisher accepts.
jobs:
  plan:
    name: Decide whether a release is due
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      action: ${{ steps.plan.outputs.action }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Plan without changing the tree
        id: plan
        shell: bash
        run: |
          set -euo pipefail
          python scripts/release/weekly.py > "$RUNNER_TEMP/release-plan.json"
          cat "$RUNNER_TEMP/release-plan.json"
          action=$(jq -r .action "$RUNNER_TEMP/release-plan.json")
          version=$(jq -r .version "$RUNNER_TEMP/release-plan.json")
          echo "action=$action" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$action" == publish ]]; then
            echo "Release due: neatlogs ${version}. Approve the \`release\` deployment, then \`pypi\`." >> "$GITHUB_STEP_SUMMARY"
          fi

  release:
    name: Tag the approved release
    needs: plan
    if: needs.plan.outputs.action == 'publish'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: release
    outputs:
      action: ${{ steps.plan.outputs.action }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Apply the approved plan
        id: plan
        shell: bash
        env:
          APPROVED_ACTION: ${{ needs.plan.outputs.action }}
          APPROVED_VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          python scripts/release/weekly.py --apply > "$RUNNER_TEMP/release-plan.json"
          cat "$RUNNER_TEMP/release-plan.json"
          action=$(jq -r .action "$RUNNER_TEMP/release-plan.json")
          version=$(jq -r .version "$RUNNER_TEMP/release-plan.json")
          if [[ "$action" != "$APPROVED_ACTION" || "$version" != "$APPROVED_VERSION" ]]; then
            echo "::error::The plan changed after approval (approved ${APPROVED_ACTION} ${APPROVED_VERSION}, now ${action} ${version}); rerun the workflow" >&2
            exit 1
          fi
          echo "action=$action" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "commit=$(jq -r '.commit // false' "$RUNNER_TEMP/release-plan.json")" >> "$GITHUB_OUTPUT"
          echo "retry_tag=$(jq -r '.retry_tag // empty' "$RUNNER_TEMP/release-plan.json")" >> "$GITHUB_OUTPUT"

      - name: Restore exact source of an unpublished tagged release
        if: steps.plan.outputs.retry_tag != ''
        env:
          RETRY_TAG: ${{ steps.plan.outputs.retry_tag }}
        run: git checkout --detach "$RETRY_TAG"

      - name: Check release App credentials
        shell: bash
        env:
          RELEASE_APP_ID: ${{ secrets.RELEASE_APP_ID }}
          RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
        run: |
          test -n "$RELEASE_APP_ID" || { echo 'RELEASE_APP_ID is missing' >&2; exit 1; }
          test -n "$RELEASE_APP_PRIVATE_KEY" || { echo 'RELEASE_APP_PRIVATE_KEY is missing' >&2; exit 1; }

      - name: Build and test the wheel and source distribution
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check build uv==0.11.16
          uv lock --check
          python -m build
          wheel=$(find dist -maxdepth 1 -name '*.whl' -print -quit)
          sdist=$(find dist -maxdepth 1 -name '*.tar.gz' -print -quit)
          test -n "$wheel" && test -n "$sdist"
          for kind in wheel sdist; do
            python -m venv "$RUNNER_TEMP/neatlogs-$kind"
            if [[ "$kind" == wheel ]]; then
              "$RUNNER_TEMP/neatlogs-$kind/bin/python" -m pip install "$wheel"
            else
              "$RUNNER_TEMP/neatlogs-$kind/bin/python" -m pip install "$sdist"
            fi
            "$RUNNER_TEMP/neatlogs-$kind/bin/python" -m pip check
            (cd "$RUNNER_TEMP" && "$RUNNER_TEMP/neatlogs-$kind/bin/python" "$GITHUB_WORKSPACE/tests/release/wheel_smoke.py")
          done

      - name: Create a repository-scoped release token
        id: release-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Commit version and tag exact release source
        shell: bash
        env:
          RELEASE_TOKEN: ${{ steps.release-token.outputs.token }}
          RELEASE_VERSION: ${{ steps.plan.outputs.version }}
          RELEASE_COMMIT: ${{ steps.plan.outputs.commit }}
        run: |
          set -euo pipefail
          git config user.name 'neatlogs-release[bot]'
          git config user.email 'neatlogs-release[bot]@users.noreply.github.com'
          git remote set-url origin "https://x-access-token:${RELEASE_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if [[ "$RELEASE_COMMIT" == true ]]; then
            git add pyproject.toml uv.lock
            git diff --cached --check
            git commit -m "chore(release): neatlogs ${RELEASE_VERSION}"
            git push origin HEAD:refs/heads/main
          fi
          git diff --exit-code
          tag="v${RELEASE_VERSION}"
          if git rev-parse --verify "refs/tags/${tag}^{commit}" >/dev/null 2>&1; then
            test "$(git rev-list -n 1 "$tag")" = "$(git rev-parse HEAD)" || {
              echo "Existing ${tag} points to another commit" >&2; exit 1;
            }
          else
            if [[ "$RELEASE_COMMIT" != true ]]; then
              # A new tag without a version commit has no fast-forward push
              # guarding it, so check that main still points to the planned commit.
              planned=$(git rev-parse HEAD)
              remote_main=$(git ls-remote --exit-code origin refs/heads/main | awk '$2 == "refs/heads/main" { print $1 }')
              if [[ "$remote_main" != "$planned" ]]; then
                echo "::error::main moved to ${remote_main:-an unknown commit} after this release was planned at ${planned}; rerun the workflow" >&2
                exit 1
              fi
            fi
            git tag -a "$tag" -m "Release ${RELEASE_VERSION}"
          fi
          git push origin "refs/tags/${tag}"

      - name: Hand the tested distributions to the publish job
        # actions/upload-artifact v4.6.2
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish to PyPI
    needs: release
    if: needs.release.outputs.action == 'publish'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/project/neatlogs/${{ needs.release.outputs.version }}/
    permissions:
      id-token: write
    steps:
      - name: Download the tested distributions
        # actions/download-artifact v4.3.0
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: python-distributions
          path: dist

      - name: Publish to PyPI through trusted publishing
        # pypa/gh-action-pypi-publish v1.14.2 (release/v1)
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33

      - name: Verify the published version
        env:
          RELEASE_VERSION: ${{ needs.release.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6; do
            if python3 - "$RELEASE_VERSION" <<'PY'
          import json, sys, urllib.request
          with urllib.request.urlopen(f'https://pypi.org/pypi/neatlogs/{sys.argv[1]}/json', timeout=15) as response:
              data = json.load(response)
          assert data['info']['version'] == sys.argv[1]
          PY
            then
              exit 0
            fi
            sleep 10
          done
          echo "PyPI did not report neatlogs ${RELEASE_VERSION}" >&2
          exit 1

  notify:
    name: Notify Slack after verified PyPI publication
    needs: [release, publish]
    if: needs.publish.result == 'success'
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Post release notification
        shell: bash
        env:
          # Incoming webhooks are channel-bound; configure this one for #released-artifacts (C0C6P2PU1UN).
          SLACK_WEBHOOK_URL: ${{ secrets.RELEASE_SLACK_WEBHOOK_URL }}
          RELEASE_VERSION: ${{ needs.release.outputs.version }}
        run: |
          set -euo pipefail
          test -n "$SLACK_WEBHOOK_URL" || { echo 'RELEASE_SLACK_WEBHOOK_URL is missing' >&2; exit 1; }
          message=":white_check_mark: *Python SDK neatlogs ${RELEASE_VERSION} published to PyPI*"
          message+=$'\n'
          message+="<https://pypi.org/project/neatlogs/${RELEASE_VERSION}/|PyPI package> · <https://github.com/${GITHUB_REPOSITORY}/tree/v${RELEASE_VERSION}|Release tag> · <https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}|Workflow run>"
          payload=$(jq -n --arg text "$message" '{text: $text}')
          response=$(curl --fail --silent --show-error --retry 2 --retry-all-errors --max-time 15 \
            --header 'Content-type: application/json' --data "$payload" "$SLACK_WEBHOOK_URL")
          test "$response" = ok || { echo "Slack webhook returned an unexpected response: $response" >&2; exit 1; }
