[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neatlogs"
version = "1.4.20"
description = "A Python package for extracting and managing LLM logs to build a collaborative workspace"
readme = "README.MD"
license = {text = "MIT"}
authors = [
    {name = "Neatlogs", email = "hello@neatlogs.com"}
]
keywords = ["llm", "tracking", "monitoring", "logging", "ai", "machine-learning", "observability", "collaboration"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: System :: Logging",
    "Topic :: System :: Monitoring",
]
requires-python = ">=3.10,<3.14"
dependencies = [
    "openinference-instrumentation>=0.1.27",
    "openinference-semantic-conventions>=0.1.13",
    "opentelemetry-api>=1.35.0",
    "opentelemetry-exporter-otlp-proto-http>=1.35.0",
    "opentelemetry-sdk>=1.35.0",
    "requests>=2.31.0",
    "agnost>=0.1.8,<0.2.0",
    "opentelemetry-instrumentation>=0.56b0",
    "opentelemetry-instrumentation-requests>=0.56b0",
    "opentelemetry-instrumentation-httpx>=0.56b0",
    "opentelemetry-instrumentation-urllib3>=0.56b0",
    "opentelemetry-instrumentation-aiohttp-client>=0.56b0",
    "opentelemetry-instrumentation-threading>=0.56b0",
    "opentelemetry-instrumentation-logging>=0.56b0",
    "wrapt>=1.0.0",
    "httpx>=0.27.0",
    "aiohttp>=3.9.0",
    # OpenInference instrumentation adapters — lightweight, do not pull in underlying LLM libs.
    # Pre-installed so neatlogs auto-instruments any supported library the user already has.
    "openinference-instrumentation-openai>=0.1.32",
    "openinference-instrumentation-anthropic>=0.1.20",
    "openinference-instrumentation-langchain>=0.1.56",
    "openinference-instrumentation-groq>=0.1.12",
    "openinference-instrumentation-litellm>=0.1.28",
    "openinference-instrumentation-google-genai>=0.1.8",
    "openinference-instrumentation-bedrock>=0.1.32",
    "openinference-instrumentation-vertexai>=0.1.11",
    "openinference-instrumentation-mistralai>=1.3.4",
    "openinference-instrumentation-crewai>=0.1.17",
    "openinference-instrumentation-dspy>=0.1.32",
    "openinference-instrumentation-agno>=0.1.25",
    "openinference-instrumentation-openai-agents>=1.4.0",
    "openinference-instrumentation-pydantic-ai>=0.1.9",
    "openinference-instrumentation-smolagents>=0.1.21",
    "openinference-instrumentation-guardrails>=0.1.10",
    "openinference-instrumentation-haystack>=0.1.29",
    "openinference-instrumentation-instructor>=0.1.12",
    "openinference-instrumentation-mcp>=1.3.3",
    "openinference-instrumentation-portkey>=0.1.7",
    "openinference-instrumentation-google-adk>=0.1.8",
    "openinference-instrumentation-autogen-agentchat>=0.1.6",
    "openinference-instrumentation-llama-index>=4.3.9",
]

[project.optional-dependencies]
# Each extra installs only the heavy underlying library.
# All openinference-instrumentation-* adapters are in base deps — no need to list them here.
azure-ai-inference = [
    "neatlogs-instrumentations[azure-ai-inference]>=0.1.1",
]
openai = [
    "openai>=1.0.0",
]
azure-openai = [
    "openai>=1.0.0",
]
anthropic = [
    "anthropic>=0.75.0",
]
langchain = [
    "chromadb>=1.1.1",
    "langchain>=1.1.2",
    "langchain-classic>=1.0.0",
    "langchain-community>=0.4.1",
    "langchain-core>=0.3.0",
    "langchain-openai>=1.1.3",
    # langchain-community's Qdrant vectorstore uses `QdrantClient.search(...)` which was
    # replaced by `query_points(...)` in qdrant-client>=1.16. Pin to a compatible client.
    "qdrant-client<1.16",
]
langgraph = [
    "langgraph>=1.0.4",
    "langchain-core>=0.3.0",
    "langchain-openai>=1.1.3",
]
crewai = [
    "crewai[azure-ai-inference]>=1.9.3",
    "litellm>=1.80.11",
]
llama-index = [
    "llama-index>=0.14.10",
]
google-adk = [
    "google-adk>=1.14.1",
]
groq = [
    "groq>=0.37.1",
]
agno = [
    "agno>=2.3.13",
]
bedrock = [
    "boto3>=1.42.11",
]
dspy = [
    "dspy>=2.6.13",
]
litellm = [
    "litellm>=1.80.11",
]
google-genai = [
    "google-genai>=1.55.0",
]
openai-agents = [
    "openai>=1.0.0",
    "openai-agents>=0.6.5",
]
guardrails = [
    "guardrails-ai>=0.4.0",
]
haystack = [
    "haystack-ai>=2.0.0",
]
instructor = [
    "instructor>=1.0.0",
]
mcp = [
    "mcp>=1.0.0",
]
mistralai = [
    "mistralai>=1.0.0",
]
portkey = [
    "portkey-ai>=1.0.0",
]
pydantic-ai = [
    "pydantic-ai>=0.0.9",
]
smolagents = [
    "smolagents>=1.0.0",
]
hermes = [
    # hermes-agent ships no wheels for 3.10; the marker keeps neatlogs installable there.
    "hermes-agent>=0.15.1; python_version >= '3.11'",
]
vertexai = [
    "google-cloud-aiplatform>=1.38.0",
]
# Vertex AI via the google-genai SDK in Vertex mode (neatlogs custom wrapper).
vertex-ai = [
    "google-genai>=1.55.0",
]
autogen-agentchat = [
    "autogen-agentchat>=0.4.0",
]
milvus = [
    # pymilvus and milvus-lite must be the same minor version to avoid a gRPC hang
    "pymilvus>=2.4.0,<2.5.0",
    "milvus-lite>=2.4.0,<2.5.0",
]

# Hermes (NousResearch/hermes-agent) discovers pip-installed observer plugins via
# this entry-point group. The value is the MODULE (Hermes calls `ep.load()` then
# `getattr(module, "register")`); the key "neatlogs" is the name users enable with
# `hermes plugins enable neatlogs`. Dormant unless Hermes is installed AND the
# plugin is enabled — costs non-Hermes users nothing.
[project.entry-points."hermes_agent.plugins"]
neatlogs = "neatlogs.hermes_plugin"

[project.urls]
Homepage = "https://github.com/NeatLogs/neatlogs"
Repository = "https://github.com/NeatLogs/neatlogs.git"
Issues = "https://github.com/NeatLogs/neatlogs/issues"
Documentation = "https://docs.neatlogs.com/"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["."]
include = ["neatlogs", "neatlogs.*"]
exclude = [
    "neatlogs.examples",
    "neatlogs.examples.*",
]

[tool.setuptools.package-data]
neatlogs = [
    "config/*.json",
]

[tool.setuptools.exclude-package-data]
neatlogs = [
    "examples",
    "examples/*",
    "examples/**/*",
]

[dependency-groups]
dev = [
    "aiohttp>=3.9.0",
    "fastapi[standard]>=0.124.0",
    # The library itself runs on opentelemetry-sdk>=1.35.0 (the release that renamed the
    # LogRecordProcessor hook to on_emit). The test suite needs more:
    # test_secondary_client.py uses InMemoryLogRecordExporter, added in 1.39.0.
    "opentelemetry-sdk>=1.39.0",
    "opentelemetry-proto>=1.35.0",
    "protobuf>=4.0.0",
    "pytest>=7.0.0",
    "pytest-asyncio>=1.3.0",
    "pytest-mock>=3.10.0",
    "python-dotenv>=1.0.0",
    "respx>=0.20.0",
    "black>=24.0.0",
    "isort>=5.13.0",
]

[tool.black]
line-length = 100
target-version = ["py310"]
exclude = """
(
  /\\.venv/
)
"""

[tool.isort]
profile = "black"
line_length = 100
skip = [".venv"]

[tool.uv]
# crewai and hermes-agent can never co-resolve: hermes-agent ships ~100 exact "==" pins,
# and every combination collides with crewai (pydantic <2.13 vs ==2.13.4, or python-dotenv
# 1.2.1 vs crewai excluding it). Declaring them conflicting lets uv lock each extra in its
# own resolution instead of failing on a single universal one.
conflicts = [
    [
        { extra = "crewai" },
        { extra = "hermes" },
    ],
]
